<div class="container mt-4">

  <h2 class="text-center mb-2">
    🟣 Preventas Disponibles 🟣
  </h2>



  <!-- ======================================================
       FORMULARIO DE CREACIÓN / EDICIÓN DE PREVENTAS
       ====================================================== -->
  <div class="card p-4 mb-4 shadow">

    <h4 class="mb-3">
      {{ editando ? 'Editar Preventa' : ' Crear Nueva Preventa' }}
    </h4>

    <div class="row">

      <!-- TÍTULO -->
      <div class="col-md-3 mb-2">
        <label class="form-label">Título</label>
        <input type="text" name="titulo" class="form-control" [(ngModel)]="formulario.titulo"
          placeholder="Ej: Elden Ring DLC" required>
      </div>

      <!-- DESCRIPCIÓN -->
      <div class="col-md-3 mb-2">
        <label class="form-label">Descripción</label>
        <input type="text" name="descripcion" class="form-control" [(ngModel)]="formulario.descripcion"
          placeholder="Descripción del juego" required>
      </div>

      <!-- FECHA LANZAMIENTO -->
      <div class="col-md-3 mb-2">
        <label class="form-label">Fecha Lanzamiento</label>
        <input type="date" class="form-control" [(ngModel)]="formulario.fechaLanzamiento">
      </div>

      <!-- PRECIO -->
      <div class="col-md-3 mb-2">
        <label class="form-label">Precio</label>
        <input type="number" class="form-control" [(ngModel)]="formulario.precio" placeholder="39990">
      </div>

      <!-- IMAGEN -->
      <div class="col-md-12 mt-2">
        <label class="form-label">URL Imagen</label>
        <input type="text" class="form-control" [(ngModel)]="formulario.imagen" placeholder="https://...">
      </div>

    </div>

    <!-- BOTONES -->
    <div class="mt-3">
      <button class="btn btn-primary me-2" (click)="guardar()">
        {{ editando ? '💾 Actualizar Preventa' : '💾 Guardar Preventa' }}
      </button>

      <button *ngIf="editando" class="btn btn-secondary" (click)="cancelar()">
        Cancelar
      </button>
    </div>

  </div>

  <!-- ======================================================
       ⭐ Semana 7 + Semana 8
       LISTADO DE PREVENTAS (con botones CRUD)
       ====================================================== -->
  <div class="row" *ngIf="preventas.length > 0; else cargando">

    <div class="col-md-4 mb-4" *ngFor="let p of preventas">
      <div class="card h-100 shadow">

        <!-- Imagen -->
        <img [src]="p.imagen" class="card-img-top" [alt]="p.titulo">

        <div class="card-body">
          <h5 class="card-title">{{ p.titulo }}</h5>

          <!-- DESCRIPCIÓN -->
          <p class="card-text" *ngIf="p.descripcion">
            {{ p.descripcion }}
          </p>

          <!-- PRECIO -->
          <p class="card-text">
            <strong> Precio:</strong> ${{ p.precio | number }}
          </p>

          <!-- FECHA -->
          <p class="card-text">
            <strong>Lanzamiento:</strong> {{ p.fechaLanzamiento }}
          </p>

        </div>

        <!-- =====================
             🟣 Semana 8 - CRUD Buttons
             ===================== -->
        <div class="card-footer d-flex justify-content-between">

          <!-- EDIT -->
          <button class="btn btn-sm btn-outline-primary" (click)="editar(p)">
            Editar
          </button>

          <!-- DELETE -->
          <button class="btn btn-sm btn-outline-danger" (click)="eliminar(p.id)">
            Eliminar
          </button>

        </div>

      </div>
    </div>

  </div>

  <!-- TEMPLATE DE CARGA -->
  <ng-template #cargando>
    <p class="text-center text-muted mt-4">
      Cargando preventas...
    </p>
  </ng-template>

</div>
